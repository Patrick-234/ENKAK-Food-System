<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENkak — Menu Manager</title>
<link rel="stylesheet" href="/src/style.css">
<script type="module" src="/src/admin-menu.js" defer></script>
</head>
<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Georgia, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <div class="text-[22px] sm:text-[26px] font-bold tracking-wide">ENkak</div>
    <div class="font-sans text-sm text-[#8A7D6E]">Menu Manager</div>
  </header>

  <main class="px-4 sm:px-6 md:px-10 pt-6 pb-12 flex flex-col gap-7">

    <section aria-label="Add new item" class="bg-white border border-[#D8C9B4] rounded-2xl p-4 sm:p-4.5">
      <h2 class="font-bold text-[15px] mb-3">Add New Item</h2>
      <form class="font-sans flex gap-3 flex-wrap items-end">
        <div class="flex flex-col gap-1 flex-[2_1_160px]">
          <label for="item-name" class="text-xs text-[#8A7D6E]">Name</label>
          <input id="item-name" type="text" placeholder="e.g. Suya Platter"
            class="box-border px-3 py-2 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#B4502A]">
        </div>
        <div class="flex flex-col gap-1 flex-[1_1_120px]">
          <label for="item-category" class="text-xs text-[#8A7D6E]">Category</label>
          <select id="item-category" class="box-border px-3 py-2 rounded-lg border border-[#D8C9B4] text-sm bg-white">
            <option>Food</option>
            <option>Drinks</option>
            <option>Snacks</option>
          </select>
        </div>
        <div class="flex flex-col gap-1 flex-[1_1_100px]">
          <label for="item-price" class="text-xs text-[#8A7D6E]">Price (₦)</label>
          <input id="item-price" type="text" placeholder="1500"
            class="box-border px-3 py-2 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#B4502A]">
        </div>
        <button type="submit" id="add-item-btn"
          class="bg-[#B4502A] text-[#F3EDE2] border-none px-4.5 py-2.5 rounded-lg text-[13px] font-semibold cursor-pointer transition-opacity duration-150 hover:opacity-85">
          Add Item
        </button>
      </form>
    </section>

    <section aria-label="Menu items">
      <h2 class="text-base font-bold mb-3.5">Menu Items</h2>
      <ul id="menu-items-list" class="list-none m-0 p-0 flex flex-col gap-2.5"></ul>
    </section>

  </main>

</body>
</html>
