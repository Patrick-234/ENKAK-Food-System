<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENkak — Rider Dashboard</title>
<link rel="stylesheet" href="/src/style.css">
<script type="module" src="/src/rider.js" defer></script>
</head>
<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Georgia, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <div class="text-[22px] sm:text-[26px] font-bold tracking-wide">ENkak</div>
    <div class="font-sans text-sm text-[#8A7D6E]">Rider Dashboard</div>
  </header>

  <div class="font-sans px-4 sm:px-6 md:px-10 pt-4">
    <p id="rider-greeting" class="text-base sm:text-[17px] font-bold">Hello — here are your deliveries</p>
  </div>

  <main class="px-4 sm:px-6 md:px-10 pt-5 pb-12 flex flex-col gap-4">
    <p id="orders-empty" class="hidden font-sans text-sm text-[#8A7D6E]">No deliveries assigned to you yet.</p>
    <div id="orders-list" class="flex flex-col gap-4"></div>
  </main>

</body>
</html>
