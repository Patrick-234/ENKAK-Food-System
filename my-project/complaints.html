<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENkak — Feedback</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Georgia, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <div class="text-[22px] sm:text-[26px] font-bold tracking-wide">ENkak</div>
    <div class="font-sans text-sm text-[#8A7D6E]">Feedback</div>
  </header>

  <main class="w-full max-w-[480px] mx-auto px-4 sm:px-6 pt-7 pb-12 flex flex-col gap-5">

    <div>
      <h1 class="text-lg font-bold mb-1">Got something to tell us?</h1>
      <p class="font-sans text-sm text-[#8A7D6E]">Let us know about an issue, or share a well done</p>
    </div>

    <nav aria-label="Feedback type" class="font-sans flex gap-2 bg-white border border-[#D8C9B4] p-1 rounded-full">
      <button type="button" id="type-complaint" aria-pressed="true"
        class="flex-1 py-2.5 rounded-full text-sm bg-[#2B2320] text-[#F3EDE2] border border-[#2B2320] transition-all duration-150 hover:opacity-85 cursor-pointer">Complaint</button>
      <button type="button" id="type-commendation" aria-pressed="false"
        class="flex-1 py-2.5 rounded-full text-sm bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Well
        Done</button>
    </nav>

    <form class="font-sans flex flex-col gap-3.5">
      <div class="flex flex-col gap-1.5">
        <label for="order-ref" class="text-xs text-[#8A7D6E]">Related order (optional)</label>
        <input id="order-ref" type="text" placeholder="e.g. Order #1042"
          class="w-full box-border px-3.5 py-2.5 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#2B2320]">
      </div>
      <div class="flex flex-col gap-1.5">
        <label id="message-label" for="message" class="text-xs text-[#8A7D6E]">Describe the issue</label>
        <textarea id="message" rows="5" placeholder="What went wrong?"
          class="w-full box-border px-3.5 py-2.5 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#2B2320]"></textarea>
      </div>
      <button type="button" id="submit-feedback"
        class="bg-[#2B2320] text-[#F3EDE2] border-none py-3.5 rounded-lg text-[15px] font-semibold cursor-pointer transition-opacity duration-150 hover:opacity-85">
        Submit Complaint
      </button>
    </form>

  </main>

</body>

</html>
