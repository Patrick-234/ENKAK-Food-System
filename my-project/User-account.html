<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENkak — My Account</title>
<link rel="stylesheet" href="/src/style.css">
<script type="module" src="/src/account.js" defer></script>
</head>
<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Georgia, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <a href="/menu.html" class="text-[22px] sm:text-[26px] font-bold tracking-wide no-underline text-[#2B2320]">ENkak</a>
    <div class="font-sans text-sm text-[#8A7D6E]">My Account</div>
  </header>

  <main class="w-full max-w-[560px] mx-auto px-4 sm:px-6 pt-7 pb-12 flex flex-col gap-7">

    <section aria-label="Profile" class="bg-white border border-[#D8C9B4] rounded-2xl p-5 flex items-center gap-4">
      <div class="w-14 h-14 rounded-full bg-[#F3EDE2] border border-[#D8C9B4] flex items-center justify-center text-xl font-bold flex-shrink-0" id="avatar-initial">A</div>
      <div class="min-w-0">
        <h1 id="profile-name" class="text-lg font-bold truncate">Ada Lovelace</h1>
        <p id="profile-email" class="font-sans text-sm text-[#8A7D6E] truncate">you@example.com</p>
        <span id="profile-role" class="font-sans inline-block mt-1 text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-[#F3EDE2] border border-[#D8C9B4]">Customer</span>
      </div>
    </section>

    <section aria-label="Active order" id="active-order-section" class="hidden">
      <h2 class="text-[15px] font-bold mb-2.5">Active Order</h2>
      <a id="active-order-link" href="#" class="no-underline block bg-white border border-[#D8C9B4] rounded-2xl p-4 hover:opacity-90 transition-opacity duration-150">
        <div class="flex justify-between items-center">
          <span id="active-order-label" class="font-sans text-sm font-semibold">Order #—</span>
          <span id="active-order-status" class="font-sans text-[11px] font-semibold px-2.5 py-1 rounded-full bg-[#E6F0F7] text-[#2B5B8C]">Out for Delivery</span>
        </div>
        <p class="font-sans text-xs text-[#8A7D6E] mt-1">Tap to track this order →</p>
      </a>
    </section>

    <section aria-label="Order history">
      <h2 class="text-[15px] font-bold mb-2.5">Order History</h2>
      <p id="orders-empty" class="hidden font-sans text-sm text-[#8A7D6E]">You haven't placed any orders yet. <a href="/menu.html" class="font-semibold text-[#2B2320]">Browse the menu</a>.</p>
      <ul id="orders-list" class="list-none m-0 p-0 flex flex-col gap-2.5"></ul>
    </section>

    <section aria-label="Account settings">
      <h2 class="text-[15px] font-bold mb-2.5">Settings</h2>
      <div class="bg-white border border-[#D8C9B4] rounded-2xl divide-y divide-[#E8DFD4]">
        <div class="flex items-center justify-between p-4">
          <div>
            <p class="font-sans text-sm font-semibold">Order update notifications</p>
            <p class="font-sans text-xs text-[#8A7D6E] mt-0.5">Get notified as your order status changes</p>
          </div>
          <label class="font-sans flex items-center gap-2 text-xs text-[#8A7D6E] cursor-pointer">
            <input type="checkbox" checked class="sr-only peer" aria-label="Toggle order notifications">
            <span class="relative w-10 h-[22px] rounded-full bg-[#B4502A] transition-colors duration-150 after:content-[''] after:absolute after:top-0.5 after:left-5 after:w-[18px] after:h-[18px] after:rounded-full after:bg-white after:transition-all"></span>
          </label>
        </div>
      </div>
    </section>

    <button type="button" id="logout-btn"
      class="font-sans bg-white text-[#A33B2B] border border-[#E3BDB4] py-3 rounded-lg text-sm font-semibold cursor-pointer transition-all duration-150 hover:opacity-80 hover:bg-[#FBEAE6]">
      Log Out
    </button>

  </main>

</body>
</html>
