<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENkak — Rate Your Order</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Georgia, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <div class="text-[22px] sm:text-[26px] font-bold tracking-wide">ENkak</div>
    <div class="font-sans text-sm text-[#8A7D6E]">Rate Your Order</div>
  </header>

  <main class="w-full max-w-[520px] mx-auto px-4 sm:px-6 pt-7 pb-12 flex flex-col gap-7">

    <div>
      <h1 class="text-lg font-bold mb-1">How was your order?</h1>
      <p class="font-sans text-sm text-[#8A7D6E]">Rate each item and your delivery experience</p>
    </div>

    <section aria-label="Rate your items">
      <h2 class="text-[15px] font-bold mb-3">Rate your items</h2>
      <ul class="list-none m-0 p-0 flex flex-col gap-3.5">

        <li class="bg-white border border-[#D8C9B4] rounded-2xl p-3.5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-lg bg-[#E9B78C] flex-shrink-0"></div>
            <span class="font-sans font-semibold text-sm">Jollof Rice</span>
          </div>
          <div class="font-sans flex gap-1" role="radiogroup" aria-label="Rating for Jollof Rice">
            <button type="button" aria-label="1 star"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="2 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="3 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="4 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="5 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
          </div>
        </li>

        <li class="bg-white border border-[#D8C9B4] rounded-2xl p-3.5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-lg bg-[#D99A6C] flex-shrink-0"></div>
            <span class="font-sans font-semibold text-sm">Grilled Chicken</span>
          </div>
          <div class="font-sans flex gap-1" role="radiogroup" aria-label="Rating for Grilled Chicken">
            <button type="button" aria-label="1 star"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="2 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="3 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="4 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="5 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
          </div>
        </li>

        <li class="bg-white border border-[#D8C9B4] rounded-2xl p-3.5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-lg bg-[#C9565A] flex-shrink-0"></div>
            <span class="font-sans font-semibold text-sm">Chapman</span>
          </div>
          <div class="font-sans flex gap-1" role="radiogroup" aria-label="Rating for Chapman">
            <button type="button" aria-label="1 star"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="2 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="3 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="4 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
            <button type="button" aria-label="5 stars"
              class="text-xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
          </div>
        </li>

      </ul>
    </section>

    <section aria-label="Rate your delivery">
      <h2 class="text-[15px] font-bold mb-2.5">Rate your delivery</h2>
      <div class="bg-white border border-[#D8C9B4] rounded-2xl p-4 flex flex-col gap-3">
        <div class="font-sans flex gap-1.5" role="radiogroup" aria-label="Delivery rating">
          <button type="button" aria-label="1 star"
            class="text-2xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
          <button type="button" aria-label="2 stars"
            class="text-2xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
          <button type="button" aria-label="3 stars"
            class="text-2xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
          <button type="button" aria-label="4 stars"
            class="text-2xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
          <button type="button" aria-label="5 stars"
            class="text-2xl text-[#D8C9B4] cursor-pointer bg-transparent border-none transition-opacity duration-150 hover:opacity-70">★</button>
        </div>
        <label for="delivery-comment" class="sr-only">Delivery comments</label>
        <textarea id="delivery-comment" rows="3" placeholder="Any comments about the delivery? (optional)"
          class="font-sans w-full box-border px-3.5 py-2.5 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#2B2320]"></textarea>
      </div>
    </section>

    <button type="button" id="submit-review"
      class="font-sans bg-[#2B2320] text-[#F3EDE2] border-none py-3.5 rounded-lg text-[15px] font-semibold cursor-pointer transition-opacity duration-150 hover:opacity-85">
      Submit Review
    </button>

  </main>

</body>

</html>
