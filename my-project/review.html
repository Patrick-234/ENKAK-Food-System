<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENkak — Rate &amp; Give Feedback</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Georgia, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <div class="text-[22px] sm:text-[26px] font-bold tracking-wide">ENkak</div>
    <div class="font-sans text-sm text-[#8A7D6E]">Rate &amp; Give Feedback</div>
  </header>

  <main class="w-full max-w-[520px] mx-auto px-4 sm:px-6 pt-7 pb-12 flex flex-col gap-7">

    <div>
      <h1 class="text-lg font-bold mb-1">How was your order?</h1>
      <p id="order-ref" class="font-sans text-sm text-[#8A7D6E]">Order #1042</p>
    </div>

    <section aria-label="Rate your items">
      <h2 class="text-[15px] font-bold mb-3">Rate your items</h2>
      <ul id="item-ratings" class="list-none m-0 p-0 flex flex-col gap-3.5"></ul>
    </section>

    <section aria-label="Rate your delivery">
      <h2 class="text-[15px] font-bold mb-2.5">Rate your delivery</h2>
      <div class="bg-white border border-[#D8C9B4] rounded-2xl p-4">
        <div id="delivery-rating" class="font-sans flex gap-1.5" role="radiogroup" aria-label="Delivery rating"></div>
      </div>
    </section>

    <section aria-label="Additional feedback">
      <h2 class="text-[15px] font-bold mb-2.5">Anything else to share?</h2>
      <nav aria-label="Feedback type" class="font-sans flex gap-2 bg-white border border-[#D8C9B4] p-1 rounded-full mb-3">
        <button type="button" id="type-complaint" aria-pressed="false"
          class="flex-1 py-2.5 rounded-full text-[13px] bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Complaint</button>
        <button type="button" id="type-commendation" aria-pressed="false"
          class="flex-1 py-2.5 rounded-full text-[13px] bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Well Done</button>
        <button type="button" id="type-none" aria-pressed="true"
          class="flex-1 py-2.5 rounded-full text-[13px] bg-[#B4502A] text-[#F3EDE2] border border-[#B4502A] transition-all duration-150 hover:opacity-85 cursor-pointer">None</button>
      </nav>
      <label for="feedback-message" class="sr-only">Feedback message</label>
      <textarea id="feedback-message" rows="3" placeholder="Any other comments? (optional)"
        class="font-sans w-full box-border px-3.5 py-2.5 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#B4502A]"></textarea>
    </section>

    <button type="button" id="submit-review"
      class="font-sans bg-[#B4502A] text-[#F3EDE2] border-none py-3.5 rounded-lg text-[15px] font-semibold cursor-pointer transition-opacity duration-150 hover:opacity-85">
      Submit Feedback
    </button>

  </main>

</body>
</html>
