<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENkak — Menu Manager</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Georgia, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <div class="text-[22px] sm:text-[26px] font-bold tracking-wide">ENkak</div>
    <div class="font-sans text-sm text-[#8A7D6E]">Menu Manager</div>
  </header>

  <main class="px-4 sm:px-6 md:px-10 pt-6 pb-12 flex flex-col gap-7">

    <section aria-label="Add new item" class="bg-white border border-[#D8C9B4] rounded-2xl p-4 sm:p-4.5">
      <h2 class="font-bold text-[15px] mb-3">Add New Item</h2>
      <form class="font-sans flex gap-3 flex-wrap items-end">
        <div class="flex flex-col gap-1 flex-[2_1_160px]">
          <label for="item-name" class="text-xs text-[#8A7D6E]">Name</label>
          <input id="item-name" type="text" placeholder="e.g. Suya Platter"
            class="box-border px-3 py-2 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#B4502A]">
        </div>
        <div class="flex flex-col gap-1 flex-[1_1_120px]">
          <label for="item-category" class="text-xs text-[#8A7D6E]">Category</label>
          <select id="item-category" class="box-border px-3 py-2 rounded-lg border border-[#D8C9B4] text-sm bg-white">
            <option>Food</option>
            <option>Drinks</option>
            <option>Snacks</option>
          </select>
        </div>
        <div class="flex flex-col gap-1 flex-[1_1_100px]">
          <label for="item-price" class="text-xs text-[#8A7D6E]">Price (₦)</label>
          <input id="item-price" type="text" placeholder="1500"
            class="box-border px-3 py-2 rounded-lg border border-[#D8C9B4] text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#B4502A]">
        </div>
        <button type="submit" id="add-item-btn"
          class="bg-[#B4502A] text-[#F3EDE2] border-none px-4.5 py-2.5 rounded-lg text-[13px] font-semibold cursor-pointer transition-opacity duration-150 hover:opacity-85">
          Add Item
        </button>
      </form>
    </section>

    <section aria-label="Menu items">
      <h2 class="text-base font-bold mb-3.5">Menu Items</h2>
      <ul class="list-none m-0 p-0 flex flex-col gap-2.5">

        <li class="bg-white border border-[#D8C9B4] rounded-2xl px-4 py-3 flex items-center gap-3.5 flex-wrap" data-item-id="jollof-rice">
          <div class="w-11 h-11 rounded-lg bg-[#E9B78C] flex-shrink-0"></div>
          <div class="flex-1 min-w-[140px]">
            <p class="font-bold text-sm">Jollof Rice</p>
            <p class="font-sans text-xs text-[#8A7D6E]">Food · ₦1,500</p>
          </div>
          <label class="font-sans flex items-center gap-2 text-xs text-[#8A7D6E] cursor-pointer">
            <span>Available</span>
            <input type="checkbox" checked class="sr-only peer" aria-label="Toggle availability for Jollof Rice">
            <span class="relative w-10 h-[22px] rounded-full bg-[#B4502A] transition-colors duration-150 after:content-[''] after:absolute after:top-0.5 after:left-5 after:w-[18px] after:h-[18px] after:rounded-full after:bg-white after:transition-all"></span>
          </label>
          <button type="button" class="bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Edit</button>
          <button type="button" class="bg-white text-[#A33B2B] border border-[#E3BDB4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#FBEAE6] cursor-pointer">Delete</button>
        </li>

        <li class="bg-white border border-[#D8C9B4] rounded-2xl px-4 py-3 flex items-center gap-3.5 flex-wrap" data-item-id="grilled-chicken">
          <div class="w-11 h-11 rounded-lg bg-[#D99A6C] flex-shrink-0"></div>
          <div class="flex-1 min-w-[140px]">
            <p class="font-bold text-sm">Grilled Chicken</p>
            <p class="font-sans text-xs text-[#8A7D6E]">Food · ₦2,200</p>
          </div>
          <label class="font-sans flex items-center gap-2 text-xs text-[#8A7D6E] cursor-pointer">
            <span>Available</span>
            <input type="checkbox" checked class="sr-only peer" aria-label="Toggle availability for Grilled Chicken">
            <span class="relative w-10 h-[22px] rounded-full bg-[#B4502A] transition-colors duration-150 after:content-[''] after:absolute after:top-0.5 after:left-5 after:w-[18px] after:h-[18px] after:rounded-full after:bg-white after:transition-all"></span>
          </label>
          <button type="button" class="bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Edit</button>
          <button type="button" class="bg-white text-[#A33B2B] border border-[#E3BDB4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#FBEAE6] cursor-pointer">Delete</button>
        </li>

        <li class="bg-white border border-[#D8C9B4] rounded-2xl px-4 py-3 flex items-center gap-3.5 flex-wrap" data-item-id="fried-rice">
          <div class="w-11 h-11 rounded-lg bg-[#E3C08A] flex-shrink-0"></div>
          <div class="flex-1 min-w-[140px]">
            <p class="font-bold text-sm">Fried Rice</p>
            <p class="font-sans text-xs text-[#8A7D6E]">Food · ₦1,500</p>
          </div>
          <label class="font-sans flex items-center gap-2 text-xs text-[#8A7D6E] cursor-pointer">
            <span>Unavailable</span>
            <input type="checkbox" class="sr-only peer" aria-label="Toggle availability for Fried Rice">
            <span class="relative w-10 h-[22px] rounded-full bg-[#D8C9B4] transition-colors duration-150 after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:w-[18px] after:h-[18px] after:rounded-full after:bg-white after:transition-all"></span>
          </label>
          <button type="button" class="bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Edit</button>
          <button type="button" class="bg-white text-[#A33B2B] border border-[#E3BDB4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#FBEAE6] cursor-pointer">Delete</button>
        </li>

        <li class="bg-white border border-[#D8C9B4] rounded-2xl px-4 py-3 flex items-center gap-3.5 flex-wrap" data-item-id="chapman">
          <div class="w-11 h-11 rounded-lg bg-[#C9565A] flex-shrink-0"></div>
          <div class="flex-1 min-w-[140px]">
            <p class="font-bold text-sm">Chapman</p>
            <p class="font-sans text-xs text-[#8A7D6E]">Drinks · ₦800</p>
          </div>
          <label class="font-sans flex items-center gap-2 text-xs text-[#8A7D6E] cursor-pointer">
            <span>Available</span>
            <input type="checkbox" checked class="sr-only peer" aria-label="Toggle availability for Chapman">
            <span class="relative w-10 h-[22px] rounded-full bg-[#B4502A] transition-colors duration-150 after:content-[''] after:absolute after:top-0.5 after:left-5 after:w-[18px] after:h-[18px] after:rounded-full after:bg-white after:transition-all"></span>
          </label>
          <button type="button" class="bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Edit</button>
          <button type="button" class="bg-white text-[#A33B2B] border border-[#E3BDB4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#FBEAE6] cursor-pointer">Delete</button>
        </li>

        <li class="bg-white border border-[#D8C9B4] rounded-2xl px-4 py-3 flex items-center gap-3.5 flex-wrap" data-item-id="meat-pie">
          <div class="w-11 h-11 rounded-lg bg-[#CBA36A] flex-shrink-0"></div>
          <div class="flex-1 min-w-[140px]">
            <p class="font-bold text-sm">Meat Pie</p>
            <p class="font-sans text-xs text-[#8A7D6E]">Snacks · ₦500</p>
          </div>
          <label class="font-sans flex items-center gap-2 text-xs text-[#8A7D6E] cursor-pointer">
            <span>Available</span>
            <input type="checkbox" checked class="sr-only peer" aria-label="Toggle availability for Meat Pie">
            <span class="relative w-10 h-[22px] rounded-full bg-[#B4502A] transition-colors duration-150 after:content-[''] after:absolute after:top-0.5 after:left-5 after:w-[18px] after:h-[18px] after:rounded-full after:bg-white after:transition-all"></span>
          </label>
          <button type="button" class="bg-[#F3EDE2] text-[#2B2320] border border-[#D8C9B4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#E9DFC9] cursor-pointer">Edit</button>
          <button type="button" class="bg-white text-[#A33B2B] border border-[#E3BDB4] px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 hover:opacity-80 hover:bg-[#FBEAE6] cursor-pointer">Delete</button>
        </li>

      </ul>
    </section>

  </main>

</body>
</html>
