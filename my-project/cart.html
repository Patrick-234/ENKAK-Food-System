<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENkak &ndash; Cart</title>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/cart.js" defer></script>
</head>

<body class="bg-[#F3EDE2] text-[#2B2320] overflow-x-hidden" style="font-family: Arial, 'Times New Roman', serif;">

  <header class="flex items-center justify-between px-4 sm:px-6 md:px-10 py-4 sm:py-5 border-b border-[#D8C9B4]">
    <div class="text-[22px] sm:text-[26px] font-bold tracking-tight">ENkak</div>
    <div class="flex gap-4 items-center">
      <div class="flex justify-end">
        <button type="button" id="clear-cart-btn" class="text-[13px] text-[#F3EDE2] bg-[#B4502A] bg-none border border-[#E3BDB4] px-3.5 py-2 md:px-4 md:py-2.5 rounded-full cursor-pointer transition-all duration-150 hover:opacity-80 ">Clear Cart</button>
      </div>

      <button type="button"
      class="flex items-center gap-2 bg-[#B4502A] text-[#F3EDE2] border border-[#D8C9B4] px-3.5 py-2 md:px-4 md:py-2.5 rounded-full text-sm transition-all duration-150 hover:opacity-70  cursor-pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      <span>Cart</span>
      <span id="cart-badge" class="bg-[#2B2320] text-[#F3EDE2] rounded-full w-5 h-5 flex items-center justify-center text-xs">0</span>
    </button>
    </div>
    
  </header>

  <main class="px-4 sm:px-6 md:px-10 pt-6 sm:pt-8 pb-12 flex flex-col lg:flex-row gap-6 lg:gap-7 items-start">

    <section aria-label="Cart items" class="flex-[2_1_420px] min-w-0 w-full flex flex-col gap-3.5">
      
      <div id="cart-items" class="flex flex-col gap-3.5"></div>
      <p id="cart-empty" class="hidden font-sans text-sm text-[#8A7D6E]">Your cart is empty. <a href="/menu.html" class="font-semibold text-[#2B2320]">Browse the menu</a>.</p>
    </section>

    <aside aria-label="Order summary"
      class="flex-[1_1_280px] min-w-0 w-full lg:sticky lg:top-5 bg-white border border-[#D8C9B4] rounded-2xl p-5 sm:p-6">
      <h2 class="text-base font-bold mb-3.5">Order Summary</h2>
      <div class="font-sans flex flex-col gap-2.5 text-sm">
        <div class="flex justify-between text-[#5C5248]"><span>Subtotal</span><span id="cart-subtotal">₦0</span></div>
        <div class="flex justify-between text-[#5C5248]"><span>Delivery fee</span><span id="cart-delivery">₦500</span></div>
        <div class="h-px bg-[#D8C9B4] my-1"></div>
        <div class="flex justify-between font-bold text-base"><span>Total</span><span id="cart-total">₦0</span></div>
      </div>
      <button type="button" id="checkout-btn"
        class="font-sans w-full mt-4.5 bg-[#B4502A]  text-[#F3EDE2] border-none py-3.5 rounded-lg text-[15px] font-semibold cursor-pointer transition-opacity duration-150 hover:opacity-85">
        Proceed to Checkout
      </button>
    </aside>

  </main>

</body>

</html>
